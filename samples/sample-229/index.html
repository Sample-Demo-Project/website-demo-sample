<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <!-- ===== 基本設定 ===== -->
    <meta charset="UTF-8">
    <title>My Static Website</title>

    <!-- ===== RWD 必備設定 ===== -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ===== 網頁描述（搜尋 / 分享用） ===== -->
    <meta name="description" content="這是一個靜態網頁範例，用來學習 HTML、CSS 與 JavaScript 的基本結構。">

    <!-- ===== 作者資訊（選用） ===== -->
    <meta name="author" content="Your Name">

    <!-- ===== Favicon（可先沒有檔案） ===== -->
    <link rel="icon" href="images/favicon.ico">

    <!-- ===== CSS 樣式 ===== -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>My Static Website</h1>
        <p>HTML / CSS / JavaScript 基本範例</p>
    </header>

    <main>
        <section>
            <h2>About</h2>
            <p>
                這是一個示範用的靜態網頁，主要用來說明 HTML 的基本結構，
                以及實務上常見的 head 設定方式。
            </p>
        </section>

        <section>
            <h2>Features</h2>
            <ul>
                <li>正確的 HTML 結構</li>
                <li>實務常用的 head 設定</li>
                <li>可搭配 CSS 與 JavaScript 擴充</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>© 2026 My Static Website</p>
    </footer>

</body>
</html>
