<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Promise Demo (Simple)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      padding: 24px;
    }
    button {
      padding: 8px 12px;
      margin-right: 8px;
      margin-bottom: 8px;
    }
    #log {
      margin-top: 12px;
      background: #fff;
      border: 1px solid #ccc;
      min-height: 90px;
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h2>Promise Demo (Simple)</h2>
  <p>A Promise represents a value that will be available later.</p>

  <button onclick="runPromise()">Run Promise</button>
  <button onclick="clearLog()">Clear</button>

  <div id="log"></div>

  <script>
    const logBox = document.getElementById("log");

    function log(message) {
      logBox.textContent += message + "\n";
    }

    function clearLog() {
      logBox.textContent = "";
    }

    function getNumberLater() {
      return new Promise((resolve) => {
        setTimeout(() => {
          resolve(42);
        }, 1500);
      });
    }

    function runPromise() {
      clearLog();
      log("Start");

      getNumberLater().then((value) => {
        log("Promise resolved: " + value);
      });

      log("This line runs before the promise resolves");
    }
  </script>
</body>
</html>
