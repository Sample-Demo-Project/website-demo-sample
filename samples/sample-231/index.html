<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Card Layout Sample</title>

    <!-- RWD 必備 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 網頁描述 -->
    <meta name="description" content="使用 HTML + CSS + Flex 與 RWD。">

    <style>
        /* ===== Reset ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }

        /* ===== Layout Container ===== */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .container h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        /* ===== Card Grid ===== */
        .card-list {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* ===== Card ===== */
        .card {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);

            width: 300px;
            padding: 20px;

            display: flex;
            flex-direction: column;
        }

        .card img {
            width: 100%;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .card h3 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .card p {
            font-size: 14px;
            color: #555;
            margin-bottom: 12px;
        }

        .card .tag {
            align-self: flex-start;
            font-size: 12px;
            padding: 4px 10px;
            background-color: #e3f2fd;
            color: #1565c0;
            border-radius: 12px;
        }

        /* ===== RWD ===== */
        @media (max-width: 600px) {
            .card-list {
                flex-direction: column;
                align-items: center;
            }

            .card {
                width: 100%;
                max-width: 360px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Course Cards</h1>

        <div class="card-list">

            <div class="card">
                <img src="https://picsum.photos/300/180" alt="course image">
                <h3>HTML Basics</h3>
                <p>
                    學習 HTML 的基本結構與常見標籤，建立網頁的骨架。
                </p>
                <span class="tag">Beginner</span>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/180" alt="course image">
                <h3>CSS Layout</h3>
                <p>
                    使用 Flex 與 RWD，打造能在各種裝置上顯示的版面。
                </p>
                <span class="tag">Intermediate</span>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/180" alt="course image">
                <h3>JavaScript Intro</h3>
                <p>
                    了解 JavaScript 的基本語法，為之後的互動功能做準備。
                </p>
                <span class="tag">Beginner</span>
            </div>

        </div>
    </div>

</body>
</html>
