<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flask API POST Sample</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      padding: 24px;
    }
    .app {
      max-width: 560px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #e2e2e2;
      border-radius: 10px;
      padding: 18px;
    }
    .form {
      display: flex;
      gap: 10px;
      margin: 12px 0;
    }
    input {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      padding: 8px 12px;
      border: 1px solid #3b67ff;
      background: #3b67ff;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
    }
    #log {
      margin-top: 10px;
      background: #f9fafc;
      border: 1px solid #e6e9f5;
      border-radius: 8px;
      padding: 10px;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }
    .hint {
      color: #666;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h2>Flask API POST Sample</h2>
    <p>Send JSON to your local Flask API: <code>POST http://127.0.0.1:5000/message</code></p>

    <div class="form">
      <input id="name" type="text" placeholder="name (e.g. Tom)" />
      <input id="message" type="text" placeholder="message (e.g. Hello)" />
      <button id="sendBtn">Send</button>
    </div>

    <div class="hint">Make sure your Flask server is running.</div>
    <pre id="log">-</pre>
  </div>

  <script>
    const nameEl = document.getElementById("name");
    const messageEl = document.getElementById("message");
    const sendBtn = document.getElementById("sendBtn");
    const logEl = document.getElementById("log");

    function setLog(text) {
      logEl.textContent = text;
    }

    async function sendMessage() {
      const name = nameEl.value.trim() || "Tom";
      const message = messageEl.value.trim() || "Hello";

      setLog("Sending...");

      try {
        const res = await fetch("http://127.0.0.1:5001/message", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, message })
        });

        const data = await res.json();
        setLog(JSON.stringify(data, null, 2));
      } catch (err) {
        setLog("Error: " + err.message);
      }
    }

    sendBtn.addEventListener("click", sendMessage);
  </script>
</body>
</html>
